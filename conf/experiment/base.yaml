# @package _global_
#
# Base experiment preset — this is the DEFAULT (a bare `run_experiment.py` uses it).
# Copy this file (e.g. conf/experiment/my_run.yaml), edit the fields, and run it with:
#
#   uv run python run_experiment.py experiment=my_run
#
# Any field from llm_culture/config.py:ExperimentConfig can be set here.

n_agents: 4
n_timesteps: 4
n_seeds: 1
network_structure: sequence        # sequence | fully_connected | circle | caveman

prompt_init: kid
prompt_update: kid
personality_list: [Empty, Empty, Empty, Empty]   # one per agent (length must equal n_agents)

backend: llama_cpp                 # none | vllm | llama_cpp
model: unsloth/SmolLM2-135M-Instruct-GGUF
generation:
  temperature: 0.8
verbose: true

output: results/base_experiment

# Analysis
analysis:
  run: true
  plot: false
