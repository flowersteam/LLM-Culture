[project]
name = "llm_culture"
version = "0.1.0"
description = "A project to simulate and analyze cultural evolution in populations of LLMs."
authors = [
    { name = "Jérémy Pérez" },
    { name = "Corentin Léger", email = "corentin.lger@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask==3.1.3",
    "gensim==4.4.0",
    "huggingface_hub==1.28.0",
    "hydra-core==1.3.2",
    "matplotlib==3.11.1",
    "networkx==3.6.1",
    "nltk==3.8.1",
    "numpy<2.5",
    "openai==3.11.0",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "textblob==0.17.1",
]

# Optional local-serving backends (GPU / local inference).
# `vllm` can only be installed on linux machines
[project.optional-dependencies]
serving = [
    "vllm==0.28.0; sys_platform == 'linux'",
    "llama-cpp-python",
]

# Optional HuggingFace sentence-embedding backend for the similarity analysis
# (alternative to the default TF-IDF). Pulls in torch, hence a separate extra.
embeddings = [
    "sentence-transformers>=3,<6",
]

[project.urls]
Homepage = "https://github.com/flowersteam/LLM-Culture"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_culture"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
