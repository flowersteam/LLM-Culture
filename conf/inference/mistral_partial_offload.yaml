# @package backend
#
# Worked example: run a LARGER model on a SMALL (discrete) GPU by offloading only
# SOME layers to the GPU and running the rest on CPU. This is the discrete-GPU
# counterpart to inference=mac_mx (on Apple Silicon you'd just use n_gpu_layers: -1).
#
# Rough memory intuition for a 7B Q4_K_M model (~4.4 GB of weights):
#   - a layer is roughly weights / n_layers (a 7B model has ~32 layers)
#   - VRAM used ≈ (n_gpu_layers / n_layers) * weight_size  +  KV cache
#   - KV cache grows with n_ctx; shrink n_ctx if you are tight on memory
# So on a ~6 GB GPU, start around n_gpu_layers: 20 and adjust (watch for CUDA OOM).
#
# vLLM equivalent (Linux/GPU): see conf/inference/linux_gpu.yaml.
kind: llama_cpp
model: TheBloke/Mistral-7B-Instruct-v0.2-GGUF
llama_cpp:
  gguf_filename: q4_k_m   # pick the Q4_K_M quant from the multi-file GGUF repo
  n_gpu_layers: 20        # offload ~20 of ~32 layers to the GPU; raise/lower to fit VRAM
  n_ctx: 4096             # lower (e.g. 2048) to shrink the KV cache if memory is tight
  flash_attn: true        # reduces KV-cache memory (if your llama.cpp build supports it)
