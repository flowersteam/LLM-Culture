[project]
name = "llm_culture"
version = "0.1.0"
description = "A project to simulate and analyze cultural evolution in populations of LLMs."
authors = [
    { name = "Jérémy Pérez" },
    { name = "Corentin Léger", email = "corentin.lger@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "Flask==3.1.3",
    "gensim==4.4.0",
    "huggingface_hub==1.28.0",
    "matplotlib==3.11.1",
    "networkx==3.6.1",
    "nltk==3.8.1",
    "numpy<2.5",
    "pandas==3.0.5",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "textblob==0.17.1",
]

# Optional local-serving backend (GPU / Linux / Colab only).
# Install with:  uv sync --extra serving   (or  pip install ".[serving]")
[project.optional-dependencies]
serving = [
    "vllm==0.28.0",
    "llama-cpp-python",
]

[project.urls]
Homepage = "https://github.com/flowersteam/LLM-Culture"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_culture"]
