# Hydra entrypoint config for scripts/run_analysis.py.
# Defaults live in AnalysisRunConfig (llm_culture/config.py); override with key=value:
#   uv run python scripts/run_analysis.py folder=results/my_run plot=true

defaults:
  - analysis_schema
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
